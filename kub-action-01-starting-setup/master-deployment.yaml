
---
apiVersion: v1
kind: Service
metadata:
  name: second-app-service
spec:
  selector:
    app: second-app
    tier: backend
  ports:
    - protocol: 'TCP'
      port: 80
      targetPort: 8080
   #  - protocol: 'TCP'
   #    port: 443
   #    targetPort: 8080
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-app-deployment
  labels:
    group: example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-app
      tier: backend

  template:
    metadata:
      labels:
        app: second-app
        tier: backend
    spec:
      containers:
      - name: second-node
        image: mfrondziak/kub-first-app
     #- name: second-node-2
     #  image: mfrondziak/kub-first-app
     #   ports:
        #- containerPort: 8080 