version: "3.8"
#docker creates networks but we can also create our own networks and assign containers to them.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      #args:
        #some_args: 1
    ports:
      - "80:80"
    volumes:
      - ./backend:/app
      - logs:/app/logs
      - /app/node_modules
    env_file:
      - ./env/backend.env
    depends_on:
      - mongodb
    
  mongodb:
    image: 'mongo:8'
    container_name: mongodb
    volumes:
      - data:/data/db
    #environment:
    #  MONGO_INITDB_ROOT_USERNAME: admin
    #  MONGO_INITDB_ROOT_PASSWORD: admin123
    env_file:
      - ./env/mongo.env
    
  frontend: 
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
     # - /app/node_modules

    stdin_open: true #interactive mode <|fim_middle|>
    tty: true 

   # env_file:
     # - ./env/frontend.env
    depends_on:
      - backend

volumes:
  data:
  logs:
